[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nero-deploy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "dm-tree>=0.1.8",
  "msgpack>=1.0.5",
  "numpy>=1.24,<2",
  "pillow>=9",
  "pyrealsense2>=2.55",
  "pyyaml>=6",
  "websockets>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
